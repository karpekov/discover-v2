# Orange4Home trial, variant `orangem` (Orange4Home + meter events): fixed-length windows of 20 events.
# Generated by tist_revision/pipeline/orange_trial.py (prepare).

dataset_name: "orangem"
raw_data_path: "data/raw/orange4home"
output_dir: "data/processed/casas/orangem/FL_20"

strategy: "fixed_length"

window_sizes: [20]
min_events_per_window: 8

# Train/val/test split by days (70/10/20), drawn once for the whole house
split_strategy: "random"
train_ratio: 0.8
random_seed: 42

overlap_factor: 0.5

use_presegmentation: false
presegment_label_level: "l1"
min_segment_events: 8
exclude_no_activity: false

filter_numeric_sensors: true
max_gap_minutes: 30

preserve_full_metadata: true
include_spatial_info: true
include_sensor_types: true

max_lines: null
max_windows: null

# Event stream (single resident; read through the stream-file path) (label in `activity_flattened`)
multiresident_flatten: true
multiresident_stream_file: "data_processed_meters.csv"
# true: windows are built inside each resident stream (R1 / R2 / both) and pooled
multiresident_split_by_resident: false
